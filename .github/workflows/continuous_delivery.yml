name: Continuous Delivery

# EVENT
# Define quando a Action vai rodar.
# Aqui ela roda sempre que houver um push no repositório.
on:
  push:

# JOBS
# Lista de jobs que o workflow vai executar.
jobs:

  # JOB
  # Nome do job. Pode ser qualquer nome.
  push_to_docker_hub:

    # RUNNER
    # Máquina virtual onde o job será executado.
    runs-on: ubuntu-latest

    # STEPS
    # Passos executados em sequência dentro do job.
    steps:

      # STEP
      # Baixa o código do repositório para dentro do runner.
      - name: Checkout repository
        uses: actions/checkout@v4

      # STEP
      # Faz login no Docker Hub.
      # DOCKER_USER deve estar em Settings > Secrets and variables > Actions > Variables
      # DOCKER_TOKEN deve estar em Settings > Secrets and variables > Actions > Secrets
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_USER }}
          password: ${{ secrets.DOCKER_TOKEN }}

      # STEP
      # Faz o build da imagem Docker e envia para o Docker Hub.
      # O repositório lucas-ra/study-apir precisa existir no Docker Hub
      # ou sua conta precisa ter permissão para criar/publicar nele.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: lucas-ra/study-apir:latest