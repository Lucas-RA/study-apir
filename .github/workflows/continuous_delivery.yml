name: Continuous Delivery

# EVENT
# Define quando a Action vai rodar.
# Aqui ela roda sempre que houver um push no repositório.
on:
  push:
  # Permite testar novamente pela aba Actions após configurar as credenciais.
  workflow_dispatch:

permissions:
  contents: read

# JOBS
# Lista de jobs que o workflow vai executar.
jobs:

  # JOB
  # Nome do job. Pode ser qualquer nome.
  push_to_docker_hub:

    # RUNNER
    # Máquina virtual onde o job será executado.
    runs-on: ubuntu-latest

    # STEPS
    # Passos executados em sequência dentro do job.
    steps:

      # STEP
      # Baixa o código do repositório para dentro do runner.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Interrompe com uma mensagem clara sem exibir as credenciais.
      - name: Check Docker Hub configuration
        env:
          DOCKER_USER: ${{ vars.DOCKER_USER }}
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
        run: |
          test -n "$DOCKER_USER" || { echo '::error::Configure a variável DOCKER_USER em Settings > Secrets and variables > Actions.'; exit 1; }
          test -n "$DOCKER_TOKEN" || { echo '::error::Configure o secret DOCKER_TOKEN com permissão de escrita no Docker Hub.'; exit 1; }

      # STEP
      # Faz login no Docker Hub.
      # DOCKER_USER deve estar em Settings > Secrets and variables > Actions > Variables
      # DOCKER_TOKEN deve estar em Settings > Secrets and variables > Actions > Secrets
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_USER }}
          password: ${{ secrets.DOCKER_TOKEN }}

      # STEP
      # Faz o build da imagem Docker e envia para o Docker Hub.
      # O repositório <DOCKER_USER>/study-apir precisa existir no Docker Hub
      # ou sua conta precisa ter permissão para criar/publicar nele.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ vars.DOCKER_USER }}/study-apir:latest
