spring.application.name=study-apir
# pede no CP
server.port=8080
# Respeita o HTTPS externo quando o perfil dev rodar em um Container App.
server.forward-headers-strategy=framework
# documentação a partir do / (raiz)
springdoc.swagger-ui.path=/
# evitando hardcode 
api.version=v1

# banco de dados - Azure SQL de desenvolvimento (separado do prd)
spring.datasource.url=jdbc:sqlserver://${DB_SERVER_URL}:${DB_SERVER_PORT:1433};databaseName=${DB_SCHEMA};encrypt=true;trustServerCertificate=false;loginTimeout=30
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PWD}

spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
